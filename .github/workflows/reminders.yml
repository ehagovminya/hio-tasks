name: Task reminders
on:
  schedule:
    - cron: "7 * * * *"   # كل ساعة
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Send reminders
        working-directory: hio-tasks/reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://ehagovminya.github.io/hio-tasks/
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "Secret FIREBASE_SERVICE_ACCOUNT not set yet - skipping"; exit 0; fi
          npm install --omit=dev
          node send.js
