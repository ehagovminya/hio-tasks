<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#012854">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="تكليفات المنيا">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">



<title>متابعة التكليفات — الرعاية الصحية فرع المنيا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#012854;--navy2:#06406b;--t:#26cad3;--td:#0a8d97;--tl:#e3f8f9;--gr:#8bdc64;--grd:#3b8f1c;--grl:#ecfae3;--br:#8f6c4e;--brl:#f5efe9;
--bg:#f2f6f8;--card:#fff;--tx:#0d1b2a;--mu:#6b7a89;--bd:#e4ebf0;--y:#b26b00;--yl:#fff4dc;--r:#d0343c;--rl:#ffe9ea;--b:#2459c9;--bl:#e7efff;
--sh:0 1px 2px rgba(1,40,84,.05),0 8px 24px -10px rgba(1,40,84,.14);--rad:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--td)}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
/* header */
header.top{position:relative;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,#0a6f86 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 28px 28px;overflow:hidden}
header.top::before{content:"";position:absolute;inset-inline-start:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(38,202,211,.35),transparent 70%)}
header.top::after{content:"";position:absolute;inset-inline-end:-40px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(139,220,100,.22),transparent 70%)}
.hrow{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.lg{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hrow .t{flex:1;min-width:0}
.hrow h1{margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow small{opacity:.78;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);color:#fff;width:42px;height:42px;border-radius:14px;font-size:18px;cursor:pointer;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.hello{position:relative;z-index:1;margin-top:16px}
.hello h2{margin:0;font-size:22px;font-weight:700}
.hello p{margin:2px 0 0;opacity:.75;font-size:13px}
main{padding:16px}
/* cards */
.card{background:var(--card);border-radius:var(--rad);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:16px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
/* buttons */
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--td);color:#fff;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,filter .12s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.p2{background:linear-gradient(135deg,var(--navy),var(--td))}
.btn.s{background:var(--tl);color:var(--td)}
.btn.w{background:#fff;color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:var(--rl);color:var(--r)}
.btn.g{background:linear-gradient(135deg,#3b8f1c,#5cb336)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px;border-radius:11px}
.btn.big{width:100%;font-size:16px;padding:14px}
.btn:disabled{opacity:.45}
/* forms */
label.f{display:block;font-size:12.5px;color:var(--mu);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;border:1.5px solid var(--bd);background:#f9fbfc;border-radius:14px;padding:11px 13px;min-height:46px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--t);background:#fff;box-shadow:0 0 0 4px rgba(38,202,211,.15)}
textarea{min-height:76px;resize:vertical}
/* nav */
nav.tabs{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:6;display:flex;justify-content:center;pointer-events:none}
nav.tabs .in{pointer-events:auto;display:flex;gap:2px;max-width:560px;width:100%;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;padding:6px;box-shadow:0 10px 34px -8px rgba(1,40,84,.28),0 0 0 1px rgba(1,40,84,.05)}
nav.tabs button{flex:1;background:none;border:0;padding:7px 2px;color:var(--mu);font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;border-radius:18px;transition:background .2s,color .2s}
nav.tabs button .e{font-size:20px;line-height:1.25;filter:grayscale(.6);opacity:.8}
nav.tabs button.on{background:var(--tl);color:var(--navy)}
nav.tabs button.on .e{filter:none;opacity:1}
.badge{position:absolute;top:2px;right:calc(50% - 24px);background:var(--r);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;min-width:17px;line-height:17px;border:2px solid #fff}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.stat .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px}
.stat b{font-size:26px;font-weight:700;line-height:1}
.stat span{font-size:12px;color:var(--mu)}
.hero{position:relative;z-index:1;margin-top:16px;display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:14px;backdrop-filter:blur(8px)}
.hero .tx{flex:1}.hero .tx b{font-size:15px}.hero .tx p{margin:3px 0 0;font-size:12.5px;opacity:.8}
/* tasks */
.task{background:#fff;border-radius:var(--rad);padding:15px;margin-bottom:12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.task::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--t)}
.task.r::before{background:var(--r)}.task.y::before{background:#f0a500}.task.g::before{background:var(--gr)}.task.b::before{background:var(--b)}
.task h4{margin:6px 0 4px;font-size:15.5px;font-weight:700;line-height:1.5}
.task .meta{font-size:12.5px;color:var(--mu);line-height:1.7}
.dchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--tl);color:var(--td)}
.dchip.adm{background:var(--brl);color:var(--br)}
.steps{display:flex;margin:14px 0 10px;position:relative}
.steps .st{flex:1;text-align:center;position:relative;font-size:11px;color:var(--mu);line-height:1.4}
.steps .st::before{content:"";position:absolute;top:9px;inset-inline-start:50%;width:100%;height:3px;background:var(--bd);z-index:0}
.steps .st:last-child::before{display:none}
.steps .st.ok::before{background:var(--t)}
.steps .dot{width:21px;height:21px;border-radius:50%;margin:0 auto 5px;background:#fff;border:3px solid var(--bd);position:relative;z-index:1;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.steps .st b{display:block;color:var(--tx);font-size:11.5px;font-weight:600}
.steps .st.cur .dot{border-color:var(--t);background:var(--t);box-shadow:0 0 0 5px rgba(38,202,211,.2)}
.steps .st.cur b{color:var(--td)}
.steps .st.miss .dot{border-color:#f3b4b8;background:#f3b4b8}
.steps .st.miss{opacity:.65}
.steps .st.hit .dot{border-color:var(--gr);background:var(--gr)}
.left{display:inline-block;margin-top:3px;font-weight:700;color:var(--td);background:var(--tl);border-radius:8px;padding:1px 7px}
.pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.g{background:var(--grl);color:var(--grd)}.pill.b{background:var(--bl);color:var(--b)}.pill.y{background:var(--yl);color:var(--y)}.pill.r{background:var(--rl);color:var(--r)}.pill.n{background:#eef2f5;color:var(--mu)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1.5px solid var(--bd);background:#fff;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* meeting */
.tr{max-height:320px;overflow-y:auto;background:linear-gradient(#f7fbfc,#f2f8fa);border-radius:16px;padding:6px 10px}
.ln{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid #e6eef2}
.ln:last-child{border:0}
.ln p{margin:0;flex:1;line-height:1.75}
.ln time{font-size:11px;color:var(--mu);white-space:nowrap;padding-top:5px}
.interim{color:var(--mu);font-style:italic;padding:6px 2px}
.rec{display:inline-flex;align-items:center;gap:7px;color:var(--r);font-weight:700;font-size:13px;background:var(--rl);padding:4px 12px;border-radius:20px}
.rec i{width:9px;height:9px;border-radius:50%;background:var(--r);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.25}}
.mic{width:86px;height:86px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--navy),var(--td));color:#fff;font-size:34px;cursor:pointer;box-shadow:0 10px 30px -6px rgba(10,141,151,.55);display:flex;align-items:center;justify-content:center;margin:6px auto}
.mic.on{background:linear-gradient(135deg,#b3202a,#e2545b);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(208,52,60,.45)}70%{box-shadow:0 0 0 18px rgba(208,52,60,0)}100%{box-shadow:0 0 0 0 rgba(208,52,60,0)}}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{background:#f4f8fa;font-size:11.5px;color:var(--mu);font-weight:600}
tbody tr:nth-child(even){background:#fbfcfd}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--bd)}
.bar{height:8px;background:#e9eff3;border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--gr));border-radius:6px}
.empty{text-align:center;color:var(--mu);padding:34px 10px}
.empty .e{font-size:46px;margin-bottom:6px}
/* login */
.lwrap{min-height:100vh;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 45%,#0a7d8c 100%);padding:calc(30px + env(safe-area-inset-top)) 18px 30px;position:relative;overflow:hidden}
.lwrap::before{content:"";position:absolute;top:-120px;right:-120px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(38,202,211,.35),transparent 70%)}
.lwrap::after{content:"";position:absolute;bottom:-140px;left:-100px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(139,220,100,.25),transparent 70%)}
.login{max-width:420px;margin:0 auto;position:relative;z-index:1}
.logo{width:112px;height:112px;border-radius:50%;margin:6px auto 14px;display:block;background:#fff;padding:4px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.lt{color:#fff;text-align:center}
.lt h2{margin:0;font-size:24px;font-weight:700}.lt p{margin:4px 0 22px;opacity:.75;font-size:13.5px}
.seg{display:flex;background:#eef3f6;border-radius:14px;padding:4px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:600;color:var(--mu);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(1,40,84,.1)}
.c{text-align:center}.mu{color:var(--mu)}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:16px;z-index:50;font-weight:600;max-width:90%;text-align:center;box-shadow:0 12px 36px rgba(1,40,84,.35);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.ov{position:fixed;inset:0;background:rgba(1,20,40,.45);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fin .2s}
@keyframes fin{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:760px;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;animation:sup .25s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:5px;background:#d6dee4;margin:0 auto 14px}
@keyframes sup{from{transform:translateY(40px)}}
.banner{background:var(--yl);color:var(--y);border-radius:16px;padding:12px 14px;font-size:13px;font-weight:600;margin-bottom:14px;line-height:1.7}
.banner.r{background:var(--rl);color:var(--r)}
.banner.i{background:var(--tl);color:var(--navy)}
/* landing */
html{scroll-behavior:smooth}
.land{background:var(--bg)}
.lhero{position:relative;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 50%,#0a7d8c 100%);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 90px;overflow:hidden}
.lhero::before{content:"";position:absolute;top:-140px;right:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(38,202,211,.38),transparent 70%)}
.lhero::after{content:"";position:absolute;bottom:-160px;left:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(139,220,100,.26),transparent 70%)}
.lnav{position:relative;z-index:2;max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px}
.lnav img{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px}
.lnav div{flex:1;line-height:1.3}.lnav b{font-size:14px;display:block}.lnav small{opacity:.75;font-size:12px}
.lgbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.lin{position:relative;z-index:2;max-width:640px;margin:0 auto;text-align:center;padding-top:34px}
.logo.xl{width:150px;height:150px;padding:6px;margin-bottom:20px;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.kicker{display:inline-block;font-size:12px;font-weight:600;background:rgba(139,220,100,.18);color:#c9f5b1;border:1px solid rgba(139,220,100,.35);padding:5px 14px;border-radius:30px}
.lin h1{font-size:34px;font-weight:700;margin:14px 0 10px;line-height:1.35}
.lin p{font-size:15.5px;line-height:1.9;opacity:.85;margin:0 auto 26px;max-width:520px}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.cta .btn{flex:1;min-width:150px;max-width:220px}
.btn.lw{background:#fff;color:var(--navy)}.btn.lo{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.4)}
.wave{position:absolute;bottom:-1px;left:0;right:0;height:46px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0;z-index:1}
.lsec{max-width:1000px;margin:0 auto;padding:26px 16px 10px}
.lsec h2{text-align:center;font-size:22px;color:var(--navy);margin:0 0 18px}
.lsec h2::after{content:"";display:block;width:46px;height:4px;border-radius:4px;margin:10px auto 0;background:linear-gradient(90deg,var(--t),var(--gr))}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.fgrid{grid-template-columns:repeat(3,1fr)}.lin h1{font-size:42px}}
.feat{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--sh)}
.feat span{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,var(--tl),var(--grl));margin-bottom:10px}
.feat b{display:block;font-size:14.5px;color:var(--navy);margin-bottom:4px}.feat p{margin:0;font-size:12.5px;color:var(--mu);line-height:1.75}
.how{display:grid;gap:12px;max-width:640px;margin:0 auto}
.step{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:20px;padding:16px;box-shadow:var(--sh)}
.step i{font-style:normal;width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--navy),var(--td))}
.step b{color:var(--navy)}.step p{margin:3px 0 0;font-size:13px;color:var(--mu);line-height:1.75}
.inst{display:grid;gap:12px;max-width:760px;margin:0 auto}@media(min-width:700px){.inst{grid-template-columns:1fr 1fr}}
.ios{margin:0;padding-inline-start:20px;line-height:2.1;font-size:14px}
.lfoot{margin-top:24px;background:var(--navy);color:rgba(255,255,255,.8);padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:12px;font-size:13px;line-height:1.7}
.lfoot img{width:48px;height:48px;border-radius:50%;background:#fff;padding:2px}.lfoot b{color:#fff}
.sec{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--navy);margin:20px 2px 10px}
.sec::after{content:"";flex:1;height:1px;background:var(--bd)}
.av{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--tl),#d5f3e0);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:14px}
.ring{flex-shrink:0}
.urow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.urow:last-child{border:0}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.qa button{border:0;border-radius:20px;padding:16px;text-align:right;cursor:pointer;color:#fff;font-weight:700;font-size:15px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh)}
.qa button span{font-size:26px}.qa button small{font-weight:500;opacity:.85;font-size:12px}
.qa .a1{background:linear-gradient(135deg,var(--navy),#0a6f86)}.qa .a2{background:linear-gradient(135deg,#0a8d97,#3fb98a)}
@media print{header.top,nav.tabs,.noprint{display:none!important}.app{padding:0}.card,.task,.stat{box-shadow:none;border:1px solid #ddd}body{background:#fff}.ph{display:flex!important}}
.ph{display:none;align-items:center;gap:12px;margin-bottom:12px}.ph img{width:60px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="config.js"></script>
<script>
"use strict";
const C = self.APP_CONFIG;
const CONFIGURED = !!(C.firebase && C.firebase.apiKey);
const DEFAULTS = JSON.parse(JSON.stringify({appName:C.appName,orgName:C.orgName,departmentGroups:C.departmentGroups,scores:C.scores,defaultDueDays:C.defaultDueDays,apkUrl:C.apkUrl||""}));
function applySettings(d){Object.assign(C,JSON.parse(JSON.stringify(DEFAULTS)),d||{});C.scores=Object.assign({},DEFAULTS.scores,(d||{}).scores||{});C.departments=Object.values(C.departmentGroups).flat();document.title=C.appName+" — "+C.orgName}
applySettings({});
const DAY = 864e5, HOUR = 36e5;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = { user:null, users:[], tasks:[], meetings:[], tab:null, ready:false, filter:"open", dept:"", month:monthKey(Date.now()), meeting:null };

/* ---------- helpers ---------- */
function monthKey(ms){const d=new Date(ms);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
const AR_MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function monthName(k){const [y,m]=k.split("-");return AR_MONTHS[+m-1]+" "+y}
function fmt(ms,withTime=true){if(!ms)return"—";const d=new Date(ms);return d.toLocaleDateString("ar-EG",{weekday:"short",day:"numeric",month:"short"})+(withTime?" "+d.toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"}):"")}
function rel(ms){const df=ms-Date.now(),a=Math.abs(df);let t;if(a<HOUR)t=Math.max(1,Math.round(a/6e4))+" دقيقة";else if(a<DAY)t=Math.round(a/HOUR)+" ساعة";else t=Math.round(a/DAY)+" يوم";return df>0?"باقي "+t:"من "+t}
function toLocalInput(ms){const d=new Date(ms);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}

function ring(p,sz=84,sw=9,dark){const r=(sz-sw)/2,c=2*Math.PI*r,v=p==null?0:Math.max(0,Math.min(100,p));const col=p==null?"#cbd5dc":p>=90?"#8bdc64":p>=75?"#26cad3":p>=60?"#f0a500":"#e2545b";
  return`<svg class="ring" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${dark?"rgba(255,255,255,.16)":"#e9eff3"}" stroke-width="${sw}"/>${p==null?"":`<circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 ${sz/2} ${sz/2})"/>`}<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${sz/4.2}" font-weight="700" fill="${dark?"#fff":"#012854"}" font-family="IBM Plex Sans Arabic,sans-serif">${p==null?"—":p+"%"}</text></svg>`}

/* ---------- scoring ---------- */
function evalTask(t,now=Date.now()){
  const sc=C.scores;
  if(t.status==="done"){const d=t.doneAt;
    if(d<=t.d1)return{score:sc.beforeD1,label:"ممتاز — قبل الموعد الأول",cls:"g",lvl:1};
    if(d<=t.d2)return{score:sc.beforeD2,label:"جيد جدًا — قبل الموعد الثاني",cls:"b",lvl:2};
    if(d<=t.d3)return{score:sc.beforeD3,label:"مقبول — قبل الموعد النهائي",cls:"y",lvl:3};
    const late=Math.ceil((d-t.d3)/DAY);return{score:Math.max(0,sc.lateStart-sc.latePerDay*late),label:"اتنفذ متأخر "+late+" يوم",cls:"r",lvl:4};}
  if(now>t.d3){const late=Math.ceil((now-t.d3)/DAY);return{score:0,label:"متأخر "+late+" يوم — لم يُنفّذ",cls:"r",overdue:true,lvl:5};}
  const st=now<=t.d1?1:now<=t.d2?2:3;
  return{score:null,label:["","قبل الموعد الأول","فات الأول — قبل الثاني","فات الثاني — آخر فرصة"][st],cls:["","g","y","r"][st],stage:st,next:t["d"+st]};
}
function responsible(t){return t.assignee?S.users.filter(u=>u.id===t.assignee):employees().filter(u=>u.dept===t.dept)}
function isMine(t){const u=S.user;return t.assignee?t.assignee===u.id:t.dept===u.dept}
function scoreLabel(p){if(p==null)return["—","n"];if(p>=90)return["ممتاز","g"];if(p>=75)return["جيد جدًا","b"];if(p>=60)return["جيد","y"];return["ضعيف","r"]}

function report(month){
  const now=Date.now();
  const tasks=S.tasks.filter(t=>monthKey(t.d1)===month);
  const rows=employees().map(u=>{
    const r={u,done:0,l1:0,l2:0,l3:0,late:0,missed:0,pending:0,sum:0,n:0};
    for(const t of tasks){const e=evalTask(t,now);
      if(t.status==="done"){ if(t.doneBy!==u.id)continue; r.done++; r["l"+Math.min(e.lvl,3)]+=e.lvl<=3?1:0; if(e.lvl===4)r.late++; r.sum+=e.score;r.n++; }
      else if(responsible(t).some(x=>x.id===u.id)){ if(e.overdue){r.missed++;r.n++;} else r.pending++; }
    }
    r.pct=r.n?Math.round(r.sum/r.n):null;return r;});
  rows.sort((a,b)=>(b.pct??-1)-(a.pct??-1)||b.done-a.done);
  const depts=C.departments.map(d=>{const ts=tasks.filter(t=>t.dept===d);let sum=0,n=0;for(const t of ts){const e=evalTask(t,now);if(e.score!=null){sum+=e.score;n++}}
    return{d,total:ts.length,done:ts.filter(t=>t.status==="done").length,pct:n?Math.round(sum/n):null}}).filter(x=>x.total);
  return{rows,depts,tasks};
}

const FV="10.12.2",FB="https://www.gstatic.com/firebasejs/"+FV+"/";
function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement("script");e.src=src;e.onload=res;e.onerror=()=>rej(new Error("load "+src));document.head.appendChild(e)})}
const Fire={
  unsubs:[],
  async init(){
    for(const f of["firebase-app-compat.js","firebase-auth-compat.js","firebase-firestore-compat.js","firebase-messaging-compat.js"])await loadScript(FB+f);
    firebase.initializeApp(C.firebase);this.auth=firebase.auth();this.fs=firebase.firestore();
    try{this.fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    this.fs.doc("settings/app").onSnapshot(s=>{applySettings(s.exists?s.data():{});render()},()=>{});
    this.auth.onAuthStateChanged(fu=>{this.unsubs.forEach(u=>u());this.unsubs=[];
      if(!fu){S.user=null;S.ready=true;render();return}
      this.unsubs.push(this.fs.doc("users/"+fu.uid).onSnapshot(s=>{
        if(!s.exists){S.user={id:fu.uid,missing:true};S.ready=true;render();return}
        const was=S.user&&S.user.approved;S.user={id:s.id,...s.data()};S.ready=true;
        if(S.user.approved&&!was)this.subscribe();render();}));
    });
  },
  subscribe(){
    const norm=d=>{const x={id:d.id,...d.data()};if(x.doneAt&&x.doneAt.toMillis)x.doneAt=x.doneAt.toMillis();return x};
    this.unsubs.push(this.fs.collection("users").onSnapshot(q=>{S.users=q.docs.map(d=>({id:d.id,...d.data()}));render()}));
    this.unsubs.push(this.fs.collection("tasks").onSnapshot(q=>{S.tasks=q.docs.map(norm);render();Notify.check()}));
    this.unsubs.push(this.fs.collection("meetings").orderBy("date","desc").limit(50).onSnapshot(q=>{S.meetings=q.docs.map(d=>({id:d.id,...d.data()}));render()}));
  },
  async login(email,pass){await this.auth.signInWithEmailAndPassword(email,pass)},
  async logout(){await this.auth.signOut()},
  async resetPass(email){await this.auth.sendPasswordResetEmail(email)},
  async register({name,email,pass,dept}){const cr=await this.auth.createUserWithEmailAndPassword(email,pass);const mgr=C.managerEmails.includes(email.toLowerCase());
    await this.fs.doc("users/"+cr.user.uid).set({name,email:email.toLowerCase(),dept:mgr?"":dept,role:mgr?"manager":"employee",title:mgr?"مدير الفرع":"",approved:mgr,createdAt:Date.now(),fcmTokens:[]})},
  async createProfile({name,dept}){const fu=this.auth.currentUser;const mgr=C.managerEmails.includes((fu.email||"").toLowerCase());
    await this.fs.doc("users/"+fu.uid).set({name,email:(fu.email||"").toLowerCase(),dept:mgr?"":dept,role:mgr?"manager":"employee",title:mgr?"مدير الفرع":"",approved:mgr,createdAt:Date.now(),fcmTokens:[]})},
  async saveMeeting(m,tasks){const ref=await this.fs.collection("meetings").add(m);const b=this.fs.batch();tasks.forEach(t=>b.set(this.fs.collection("tasks").doc(),{...t,meetingId:ref.id}));await b.commit()},
  async addTask(t){await this.fs.collection("tasks").add(t)},
  async completeTask(id,note){await this.fs.doc("tasks/"+id).update({status:"done",doneAt:firebase.firestore.FieldValue.serverTimestamp(),doneBy:S.user.id,note:note||""})},
  async updateTask(id,p){await this.fs.doc("tasks/"+id).update(p)},
  async deleteTask(id){await this.fs.doc("tasks/"+id).delete()},
  async updateUser(id,p){await this.fs.doc("users/"+id).update(p)},
  async deleteUser(id){await this.fs.doc("users/"+id).delete()},
  async saveSettings(p){await this.fs.doc("settings/app").set(p,{merge:true})},
  async renameDept(o,n){const b=this.fs.batch();(await this.fs.collection("tasks").where("dept","==",o).get()).forEach(d=>b.update(d.ref,{dept:n}));(await this.fs.collection("users").where("dept","==",o).get()).forEach(d=>b.update(d.ref,{dept:n}));await b.commit()},
  async saveToken(tok){await this.fs.doc("users/"+S.user.id).update({fcmTokens:firebase.firestore.FieldValue.arrayUnion(tok)})}
};

/* ---------- notifications ---------- */
const Notify={
  async enable(){
    if(!("Notification" in window)){toast("الجهاز ده مش بيدعم الإشعارات — على الآيفون لازم تضيف التطبيق للشاشة الرئيسية الأول");return}
    const p=await Notification.requestPermission();if(p!=="granted"){toast("لازم توافق على الإشعارات من إعدادات المتصفح");return}
    if(C.vapidKey&&self.swReg){try{const tok=await firebase.messaging().getToken({vapidKey:C.vapidKey,serviceWorkerRegistration:self.swReg});if(tok)await Fire.saveToken(tok)}catch(e){console.warn(e)}}
    toast("تم تفعيل الإشعارات ✓");render();this.check();
  },
  async show(title,body,tag){try{if(self.swReg)await self.swReg.showNotification(title,{body,tag,icon:"icons/icon-192.png",badge:"icons/icon-192.png",dir:"rtl",lang:"ar"});else new Notification(title,{body,tag})}catch(e){}},
  check(){
    if(!S.user||!S.user.approved||!("Notification" in window)||Notification.permission!=="granted")return;
    const sent=store.get("hio_sent",{}),now=Date.now();
    for(const t of S.tasks){if(t.status==="done")continue;
      const mine=isMgr()?false:isMine(t);const e=evalTask(t,now);
      if(e.overdue){if((mine||isMgr())&&!sent[t.id+"o"]){sent[t.id+"o"]=1;this.show("⚠️ تكليف متأخر",t.title+" — "+t.dept,t.id)}continue}
      if(!mine)continue;
      const left=e.next-now,k=t.id+"-"+e.stage;
      if(left<3*HOUR&&!sent[k+"h"]){sent[k+"h"]=1;this.show("⏰ الموعد "+["","الأول","الثاني","النهائي"][e.stage]+" قرّب جدًا",t.title+" — "+rel(e.next),t.id)}
      else if(left<DAY&&!sent[k+"d"]){sent[k+"d"]=1;this.show("📌 تذكير بتكليف",t.title+" — الموعد "+["","الأول","الثاني","النهائي"][e.stage]+" "+rel(e.next),t.id)}
    }
    store.set("hio_sent",sent);
  }
};
setInterval(()=>Notify.check(),60000);

/* task card */
function taskCard(t,opts={}){
  const e=evalTask(t),done=t.status==="done",now=Date.now();
  const steps=[1,2,3].map(n=>{const d=t["d"+n];let cls="",ic="";
    if(done){if(e.lvl===n){cls="hit";ic="✓"}else if(e.lvl>n||e.lvl===4){cls="miss ok"}}
    else if(e.stage===n)cls="cur";else if(now>d){cls="miss ok";ic="✕"}
    return`<div class="st ${cls}"><div class="dot">${ic}</div><b>${["","الأول","الثاني","النهائي"][n]}</b>${new Date(d).toLocaleDateString("ar-EG",{weekday:"short",day:"numeric",month:"short"})}<br>${new Date(d).toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"})}${!done&&e.stage===n?`<br><span class="left">${rel(d)}</span>`:""}</div>`}).join("");
  const who=t.assignee?userName(t.assignee):"كل الإدارة";
  const canDo=!done&&!isMgr()&&isMine(t);
  return`<div class="task ${e.cls}"><div class="row" style="justify-content:space-between">${deptChip(t.dept)}<span class="pill ${e.cls||"n"}">${done?e.score+"%":e.overdue?"متأخر":"جاري"}</span></div>
  <h4>${esc(t.title)}</h4><div class="meta">👤 ${esc(who)}</div>
  ${t.details?`<p style="margin:6px 0 0;font-size:13.5px;line-height:1.7">${esc(t.details)}</p>`:""}
  <div class="steps">${steps}</div>
  <div class="meta">${done?"✅ اتنفذ "+fmt(t.doneAt)+" — "+esc(userName(t.doneBy))+" · <b>"+e.label+"</b>"+(t.note?"<br>📝 "+esc(t.note):""):"⏳ "+e.label}</div>
  <div class="row noprint" style="margin-top:12px">
   ${canDo?`<button class="btn g grow" onclick="complete('${t.id}')">✓ تم التنفيذ</button>`:""}
   ${!done&&!isMgr()?`<button class="btn s" onclick="calSheet('${t.id}')">📅 تذكير</button>`:""}
   ${isMgr()?`${done?`<button class="btn w sm" onclick="reopen('${t.id}')">↩︎ إعادة فتح</button>`:`<button class="btn w sm" onclick="editTask('${t.id}')">✏️ تعديل</button>`}<button class="btn d sm" onclick="delTask('${t.id}')">حذف</button>`:""}
  </div></div>`;
}
function sortTasks(a){return a.slice().sort((x,y)=>{const ex=evalTask(x),ey=evalTask(y);if((x.status==="done")!==(y.status==="done"))return x.status==="done"?1:-1;if(x.status==="done")return y.doneAt-x.doneAt;return(ex.overdue?0:ex.next)-(ey.overdue?0:ey.next)})}

function startMeeting(){S.meeting={title:$("#mtt").value.trim()||"اجتماع",date:Date.now(),transcript:[],tasks:[]};render();startRec()}
async function startRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const mobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
  Rec.err="";Rec.status="";Rec.on=true;
  try{Rec.wake=await navigator.wakeLock?.request("screen")}catch(e){}
  // على الموبايل المايك مينفعش يتسجل ويتفرّغ في نفس الوقت — التفريغ له الأولوية
  if(!mobile||!SR){try{const st=await navigator.mediaDevices.getUserMedia({audio:true});Rec.stream=st;
    if(window.MediaRecorder){Rec.chunks=[];Rec.mr=new MediaRecorder(st);Rec.mr.ondataavailable=e=>e.data.size&&Rec.chunks.push(e.data);Rec.mr.onstop=()=>{Rec.audioUrl=URL.createObjectURL(new Blob(Rec.chunks,{type:Rec.mr.mimeType||"audio/webm"}));render()};Rec.mr.start(5000)}
    try{const ac=new (window.AudioContext||window.webkitAudioContext)();const an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(st).connect(an);const buf=new Uint8Array(an.fftSize);Rec.ac=ac;
      const tick=()=>{if(!Rec.on)return;an.getByteTimeDomainData(buf);let m=0;for(const b of buf)m=Math.max(m,Math.abs(b-128));const el=$("#lvl");if(el)el.style.width=Math.min(100,m*2)+"%";requestAnimationFrame(tick)};tick()}catch(e){}
  }catch(e){if(!SR){Rec.on=false;toast("لازم تسمح بالمايكروفون");render();return}}}
  if(SR){const sr=new SR();sr.lang="ar-EG";sr.continuous=true;sr.interimResults=true;sr.maxAlternatives=1;
    const st=s=>{Rec.status=s;const el=$("#srst");if(el)el.innerHTML=srStatus()};
    sr.onstart=()=>st("listen");sr.onspeechstart=()=>st("speech");
    sr.onresult=e=>{let it="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){const x=r[0].transcript.trim();if(x){S.meeting.transcript.push({t:Date.now(),x});Rec.interim="";Rec.err="";render();}}else it+=r[0].transcript}Rec.interim=it;const el=$("#interim");if(el)el.textContent=it;st("speech")};
    sr.onerror=e=>{if(e.error==="no-speech"||e.error==="aborted")return;
      const M={"not-allowed":"المايكروفون مقفول — اضغط على علامة القفل جنب اللينك فوق واسمح بالمايكروفون","service-not-allowed":"المتصفح مانع خدمة التفريغ — استخدم Google Chrome","audio-capture":"المايكروفون مش متاح أو برنامج تاني ماسكه — اقفل أي برنامج تسجيل شاشة أو مكالمات","network":"التفريغ محتاج إنترنت — اتأكد من الاتصال","language-not-supported":"اللغة العربية مش مدعومة على المتصفح ده"};
      Rec.err=M[e.error]||("مشكلة في التفريغ: "+e.error);if(["not-allowed","service-not-allowed","audio-capture","language-not-supported"].includes(e.error))Rec.fatal=true;render()};
    sr.onend=()=>{st("");if(Rec.on&&!Rec.fatal)setTimeout(()=>{if(Rec.on)try{sr.start()}catch(x){}},300)};
    Rec.fatal=false;try{sr.start()}catch(e){Rec.err="مشكلة في تشغيل التفريغ: "+e.message}Rec.sr=sr}
  else Rec.err="المتصفح ده مش بيدعم التفريغ الصوتي — افتح التطبيق من Google Chrome";
  render();
}

  return`<div class="card c"><p class="mu" style="margin:0 0 8px">تقييمك في ${monthName(S.month)}</p>${ring(r.pct??null,150,14)}<div style="margin-top:8px"><span class="pill ${c}">${l}</span>${rank>=0?` <span class="pill n">ترتيبك ${rank+1} من ${employees().length}</span>`:""}</div></div>
  <div class="stats">${st("🥇","var(--grl)",r.l1||0,"قبل الموعد الأول","var(--grd)")}${st("👍","var(--tl)",(r.l2||0)+(r.l3||0),"قبل الثاني/النهائي","var(--td)")}${st("⚠️","var(--rl)",(r.late||0)+(r.missed||0),"متأخر","var(--r)")}${st("⏳","#eef2f5",r.pending||0,"جاري","var(--navy)")}</div>
  <div class="card"><h3>📈 آخر 6 شهور</h3>${hist.map(h=>`<div class="row" style="padding:6px 0"><span style="width:104px;font-size:13px">${monthName(h.m)}</span><div class="bar grow"><i style="width:${h.r&&h.r.pct||0}%"></i></div><b style="width:44px;text-align:left">${h.r&&h.r.pct!=null?h.r.pct+"%":"—"}</b></div>`).join("")}</div>
  <div class="banner i">💡 نفّذ قبل الموعد الأول = ${C.scores.beforeD1}% · قبل الثاني = ${C.scores.beforeD2}% · قبل النهائي = ${C.scores.beforeD3}% · بعد كده التقييم بيقل كل يوم.</div>`}
function meView(){const p="Notification" in window?Notification.permission:"unsupported";const ios=/iphone|ipad/i.test(navigator.userAgent),standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  return`<div class="card"><div class="row"><div class="av">${esc(initials(S.user.name))}</div><div class="grow"><b>${esc(S.user.name)}</b><div class="mu" style="font-size:12px">${esc(S.user.email||"")} · ${esc(roleName(S.user))}</div></div></div></div>
  <div class="card"><h3>🔔 الإشعارات</h3>${p==="granted"?'<p class="mu">الإشعارات شغالة ✓ — هيوصلك تذكير قبل كل موعد بيوم وقبله بـ 3 ساعات.</p>':p==="unsupported"?`<p class="mu">${ios&&!standalone?"على الآيفون: اضغط زر المشاركة ⎋ ثم \"إضافة إلى الشاشة الرئيسية\"، وافتح التطبيق من الأيقونة وفعّل الإشعارات.":"المتصفح ده مش بيدعم الإشعارات."}</p>`:'<button class="btn big" onclick="Notify.enable()">تفعيل الإشعارات</button>'}</div>
  ${isMgr()?`<div class="card"><h3>إدارة النظام</h3><button class="btn p2 big" onclick="go('settings')">⚙️ الإعدادات والإدارات والتقييم</button><button class="btn s big" style="margin-top:8px" onclick="go('team')">👥 الموظفين والصلاحيات</button></div>`:""}
  <button class="btn w big" onclick="DB.logout()">تسجيل خروج</button>`}

/* boot */
if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").then(r=>{self.swReg=r}).catch(()=>{})}
if(!CONFIGURED){$("#app").innerHTML=`<div class="lwrap"><div class="login"><div class="lt"><img class="logo" src="${LOGO}" alt=""><h2>${esc(C.appName)}</h2><p>${esc(C.orgName)}</p></div><div class="card c"><div style="font-size:40px">🔧</div><h3>النظام محتاج ربط بقاعدة البيانات</h3><p class="mu">حط بيانات مشروع Firebase في ملف config.js (الخطوات في ملف README).</p></div></div></div>`}
else{render();DB.init().catch(e=>{$("#app").innerHTML='<div class="login c"><h3>مش قادر يتصل بالسيرفر</h3><p class="mu">'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">حاول تاني</button></div>'})}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)Notify.check()});
</script>
</body>
</html>
